version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: waveform-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waveform-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waveform_secure_password_builds}
      POSTGRES_DB: ${POSTGRES_DB:-waveform_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waveform-api
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: postgres://postgres:waveform_secure_password_builds@postgres:5432/waveform_prod?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.25-alpine
    container_name: waveform-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: waveform-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
